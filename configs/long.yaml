total_timesteps: 500000
evaluation_episodes: 20

sensor_noise:
  enabled: true
  angle_noise_std_deg: 0.25
  angle_bias_std_deg: 1.0
  gyro_noise_std_dps: 0.10
  gyro_bias_std_dps: 0.30

ppo:
  n_envs: 4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gae_lambda: 0.95
  gamma: 0.9
  ent_coef: 0.0
  learning_rate: 0.001
  clip_range: 0.2
  use_sde: true
  sde_sample_freq: 4
