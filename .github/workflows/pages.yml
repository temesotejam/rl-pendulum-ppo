name: Publish Training Dashboard

on:
  workflow_run:
    workflows: ["Train RL Agent"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve training run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Train RL Agent" \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Train RL Agent run was found." >&2
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using training run $RUN_ID"

      - name: Download training artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          mkdir -p downloaded
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          find downloaded -maxdepth 3 -type f | sort

      - name: Locate training result
        id: result
        run: |
          METADATA="$(find downloaded -type f -name metadata.json -print -quit)"
          if [ -z "$METADATA" ]; then
            echo "metadata.json was not found in the downloaded artifact." >&2
            exit 1
          fi
          RESULT_DIR="$(dirname "$METADATA")"
          echo "dir=$RESULT_DIR" >> "$GITHUB_OUTPUT"
          echo "Result directory: $RESULT_DIR"

      - name: Build static dashboard
        run: |
          python web/build_pages.py \
            --input "${{ steps.result.outputs.dir }}" \
            --output site \
            --run-url "${{ steps.source.outputs.run_url }}"

          test -f site/index.html
          test -f site/videos/00_random.mp4
          test -f site/videos/04_100_percent.mp4
          test -f site/plots/learning_curve.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
